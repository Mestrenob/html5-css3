<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        td, th, caption {
            padding: 10px;
            border: 2px solid black;
        }

        .destaque {
            background-color: grey;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <caption style="font-size: 1.5em;" class="destaque">Boletim Escolar</caption>
            <tr>
                <th rowspan="2" scope="col" class="destaque">Área</th>
                <th rowspan="2" scope="col" class="destaque">Disciplinas</th>
                <th colspan="2" scope="colgroup" class="destaque">Notas</th>
                <th rowspan="2" scope="col" class="destaque">Média</th>
            </tr>
            <tr>
                <th scope="col" class="destaque">Nota 1</th>
                <th scope="col" class="destaque">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup" class="destaque">Exatas</th>
                <td>Matemática</td>
                <td>2</td>
                <td>4</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>4</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>5</td>
                <td>7</td>
                <td>6</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>7</td>
                <td>9</td>
                <td>8</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="destaque">Média Exatas</th>
                <td class="destaque">999</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup" class="destaque">Humanas</th>
                <td>História</td>
                <td>4</td>
                <td>6</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>8</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="destaque">Média Humanas</th>
                <td class="destaque">999</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
