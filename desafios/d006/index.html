<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d006</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML, podemos inseriros elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deve utilizar em cada caso.</p>
    <ul>
        <li><abbr title="&lt;p&gt;">Paragrafos</abbr></li>
        <li><abbr title="&lt;h1&gt;">Títulos</abbr></li>
        <li><abbr title="&lt;img&gt;">Imagens</abbr></li>
        <li><abbr title="&lt;abbr&gt;">Abreviações</abbr></li>
        <li><abbr title="&lt;!DOCTYPE html&gt; &lt;html&gt; &lt;/html&gt; &lt;body&gt; &lt;/body&gt;">Códigos-fonte</abbr></li>
        <li><abbr title="&lt;ol&gt;">Listas Numeradas</abbr></li>
        <li><abbr title="&lt;ul&gt;">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
