<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posições de Fundo</title>
    <style>
        div {
            display: inline-block;
            width: 400px;
            height: 280px;
            border: 5px solid purple;
            background-image: url(imagens/wallpaper003.jpg);
        }

        #d1 {background-position: top left;}
        #d2 {background-position: top center;}
        #d3 {background-position: top right;}
        #d4 {background-position: center left;}
        #d5 {background-position: center center;}
        #d6 {background-position: center right;}
        #d7 {background-position: bottom left;}
        #d8 {background-position: bottom center;}
        #d9 {background-position: bottom right}

    </style>
</head>
<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <br>
    <div id="d4"></div>
    <div id="d5"></div>
    <div id="d6"></div>
    <br>
    <div id="d7"></div>
    <div id="d8"></div>
    <div id="d9"></div>
</body>
</html>
