<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex007</title>
    <style>
        section {
            display: flex;
            
            background-color: blue;
            padding: 3px;
            height: 400px;
        }
        div {
            background-color: gray;
            margin: 2px;
            text-align: center;
            padding: 20px;

        }

        #i1 {align-self: auto;}
        #i2 {align-self: flex-start;}
        #i3 {align-self: flex-end;}
        #i4 {align-self: center;}
        #i5 {align-self: stretch;}
    </style>
</head>
<body>

<section>
    <div id="i1">A</div>
    <div id="i2">B</div>
    <div id="i3">C</div>
    <div id="i4">D</div>
    <div id="i5">E</div>
</section>
    
</body>
</html>
