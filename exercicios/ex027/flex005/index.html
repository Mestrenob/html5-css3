<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.137);
        }
        body {
            background-color: blue;
            height: 100vh;
            width: 100vw;
        }

        main {
            background-color: white;
            width: 80vw;
            height: 80vh;

            display: flex;
            flex-flow: row wrap;
            justify-content: flex-end;
            align-items: flex-end;
        }

        section {
            background-color: gray;
            width: 60vw;
            height: 60vh;

            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            align-items: center;
        }

        div {
            background-color: red;
            width: 200px;
            height: 200px;
        }

    </style>
</head>
<body>
    <main>
        <section>
            <div></div>
        </section>
    </main>
    
</body>
</html>
