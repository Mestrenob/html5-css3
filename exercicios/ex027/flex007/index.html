<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex007</title>
    <style>
        section {
            display: flex;
            background-color: blue;
            padding: 3px;
        }
        div {
            background-color: gray;
            margin: 2px;
            text-align: center;
            padding: 20px;

        }

        #i1 {order: 5;}
        #i2 {order: 1;}
        #i3 {order: 0;}
        #i4 {order: 1;}
        #i5 {order: 2;}
        #i6 {order: -2;}
        #i7 {order: -1;}
    </style>
</head>
<body>

<section>
    <div id="i1">A</div>
    <div id="i2">B</div>
    <div id="i3">C</div>
    <div id="i4">D</div>
    <div id="i5">E</div>
    <div id="i6">F</div>
    <div id="i7">G</div>
</section>
    
</body>
</html>
