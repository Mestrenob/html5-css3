<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 03</title>
    <style>
        table {
            width: 500px;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
        }

        #cnome:hover {
            background-color: black;
            color: white;
        }

        #cidade:hover {
            background-color: black;
            color: white;
        }

        .csexo:hover {
            background-color: black;
            color: white;
        }


    </style>
</head>
<body>
    <table>
        <colgroup>
            <col id="cnome">
            <col id="cidade">
            <col class="csexo">
        </colgroup>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Idade</th>
            <th scope="col">Sexo</th>
        </tr>
        <tr>
            <td>Talisa</td>
            <td>99</td>
            <td>feminino</td>
        </tr>
        <tr>
            <td>Fidel</td>
            <td>99</td>
            <td>masculino</td>
        </tr>
        <tr>
            <td>Beijamin</td>
            <td>1</td>
            <td>Masculino</td>
        </tr>
    </table>
    
</body>
</html>
