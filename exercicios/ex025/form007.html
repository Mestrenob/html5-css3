<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis output</title>
</head>
<body>
    <form action="cadastro.php">
        <p>
            <label for="inota">Sua nota para o filme:</label>
            <input type="range" name="nota" id="inota" min="1" max="10" value="5"
            oninput="ival.innerHTML = Number(inota.value)">
            <output id="ival">5</output>
        </p>
    </form>
</body>
</html>
