<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de checkbox radio</h1>
    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Sexo</legend>
            <p>
                <label for="homem">Masculino</label>
                <input type="radio" name="sexo" id="homem">
                <br>
                <label for="mulher">Feminimo</label>
                <input type="radio" name="sexo" id="mulher">
            </p>
        </fieldset>
        <fieldset>
            <legend>Cultura pop</legend>
            <p>
                <label for="ifilmes">Filmes</label>
                <input type="checkbox" name="filmes" id="ifilmes"> <br>
                <label for="iseries">Series</label>
                <input type="checkbox" name="series" id="iseries"> <br>
                <label for="ijogos">Jogos</label>
                <input type="checkbox" name="jogos" id="ijogos"> <br>
                <label for="imusicas">Musicas</label>
                <input type="checkbox" name="musicas" id="imusicas"> <br>
                <label for="ilivros">Livros</label>
                <input type="checkbox" name="livros" id="ilivros"> <br>
                <label for="irpg">RPG</label>
                <input type="checkbox" name="rpg" id="irpg"> <br>
                <label for="ibgames">Boardgames</label>
                <input type="checkbox" name="bgames" id="ibgames">
            </p>
        </fieldset>
        <p>
            <label for="inota">Nota:</label>
            <input type="range" name="nota" id="inota" max="5">
        </p>
        <p>
            <label for="icor">Escola uma cor:</label>
            <input type="color" name="cor" id="icor">
        </p>
        <p>
            <label for="foto">Foto de perfil:</label>
            <input type="file" name="foto" id="ifoto">
        </p>
    </form>
    
</body>
</html>
